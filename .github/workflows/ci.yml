name: CI

on: [ push, pull_request ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
      - uses: actions-rust-lang/rustfmt@v1

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features regex -- -D warnings
      - run: cargo clippy --all-targets --features locale -- -D warnings
      - run: cargo clippy --all-targets --features locale --features regex -- -D warnings
      - run: cargo clippy --all-targets --features language -- -D warnings
      - run: cargo clippy --all-targets --features region -- -D warnings
      - run: cargo clippy --all-targets --features rocket -- -D warnings
      - run: cargo clippy --all-targets --features locale --features rocket -- -D warnings
      - run: cargo clippy --all-targets --features language --features rocket -- -D warnings
      - run: cargo clippy --all-targets --features region --features rocket -- -D warnings

  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        toolchain:
          - stable
          - nightly
        features:
          -
          - --features regex
          - --features locale
          - --features locale --features regex
          - --features language
          - --features region
          - --features locale --features rocket
          - --features language --features rocket
          - --features region --features rocket
    name: Test ${{ matrix.toolchain }} on ${{ matrix.os }} (${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test ${{ matrix.features }}
      - run: cargo doc ${{ matrix.features }}

  MSRV:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        toolchain:
          - 1.88
        features:
          -
          - --features regex
          - --features locale
          - --features locale --features regex
          - --features language
          - --features region
          - --features locale --features rocket
          - --features language --features rocket
          - --features region --features rocket
    name: Test ${{ matrix.toolchain }} on ${{ matrix.os }} (${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --lib --bins ${{ matrix.features }}