[package]
name = "json-gettext"
version = "5.0.0"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/magiclen/json-gettext"
homepage = "https://magiclen.org/json-gettext"
keywords = ["json", "i18n", "multi-language", "static", "rocket"]
categories = ["internationalization"]
description = "A library for getting text from JSON usually for internationalization."
license = "MIT"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
serde = "1.0.184"
serde_json = "1.0.50"
regex = { version = "1", optional = true }
unic-langid = { version = "0.9", features = ["macros"], optional = true }
manifest-dir-macros = { version = "0.1.3", features = ["tuple"] }

rocket = { version = "0.5", optional = true }

[dev-dependencies]
# Only used for Rocket examples.
rocket-accept-language = "0.9"

[features]
# `langid` is an internal umbrella feature; enable `locale`, `language`, or `region` instead.
langid = ["dep:unic-langid"]
locale = ["langid"]
language = ["langid"]
region = ["langid"]

# Enables `get_filtered_text` and `get_filtered_text_with_key`, which match text keys against a regular expression.
regex = ["dep:regex"]

rocket = ["dep:rocket"]

[[example]]
name = "hello"
required-features = ["rocket"]

[[example]]
name = "hello_locale"
required-features = ["rocket", "locale"]

[[example]]
name = "hello_language"
required-features = ["rocket", "language"]

[[example]]
name = "hello_region"
required-features = ["rocket", "region"]

# `locale`, `language`, and `region` are mutually exclusive, so all-features cannot be used here.
[package.metadata.docs.rs]
features = ["regex", "rocket", "locale"]
rustdoc-args = ["--cfg", "docsrs"]